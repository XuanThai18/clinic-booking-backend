# ==============================================================
#                 CORE APPLICATION CONFIGURATION
# ==============================================================
spring.application.name=Clinic Booking Backend
server.port=${PORT:8080}

# ==============================================================
#                 DATABASE (POSTGRESQL)
# ==============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinic_booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# ==============================================================
#                 JPA & HIBERNATE
# ==============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
#                 SECURITY & ENCRYPTION
# ==============================================================
application.security.jwt.secret-key=${JWT_SECRET:dev-only-secret-0123456789abcdef0123456789abcdef0123456789abcdef}
application.security.db.encryption-key=${DB_ENCRYPTION_KEY:DevLocalKey12345}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ==============================================================
#                 PAYMENT GATEWAY (VNPAY)
# ==============================================================
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.secret-key=${VNPAY_SECRET_KEY:}

# ==============================================================
#                 EMAIL SERVICE (GMAIL SMTP)
# ==============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================================================
#                 CLOUDINARY (IMAGE STORAGE)
# ==============================================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# ==============================================================
#                 GOOGLE RECAPTCHA V2
# ==============================================================
recaptcha.secret=${RECAPTCHA_SECRET:}
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# ==============================================================
#                 APACHE KAFKA
# ==============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=event:vn.xuanthai.clinic.booking.dto.response.AppointmentBookedEvent

# ==============================================================
#                 TOKEN EXPIRATION
# ==============================================================
application.security.jwt.expiration=900000
application.security.jwt.refresh-token.expiration=2592000000